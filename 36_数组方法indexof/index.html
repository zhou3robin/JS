<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // indexOf方法返回给定元素在数组中第一次出现的位置，如果没有出现则返回-1
        var arr = [10,20,33,44,55,20,60];
        console.log(arr.indexOf(55));
        
        // 判断是否存在某个数
        if(arr.indexOf(20) > 0){
            console.log("存在");
        }else{
            console.log("不存在");
        }

        // indexOf方法还可以接受第二个参数，表示搜索开始的位置
        console.log(arr.indexOf(20));
        console.log(arr.indexOf(20,3));
    </script>
</body>
</html>
