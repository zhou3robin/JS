<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var arr = ["hello"];
        // arr[1] = "大家好" 这个方式有时候并不知道下表是多少
        
        // push方法用于在数组的末端添加一个或者多个元素，并返回添加新元素后数组的长度
        // 该方法会改变原数组的内容
        var myLength = arr.push("大家好","world",100,true);
        console.log(arr);
        console.log(myLength);

        //pop方法用于删除数组的最后一个元素，并返回该元素。注意，该方法会改变原数组
        arr.pop();
        console.log(arr);
    </script>
</body>
</html>
