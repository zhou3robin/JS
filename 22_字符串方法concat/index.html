    <script>
        var str1 = 'hello';

        var result3 = str1.concat(str2, str3);
        console.log(result3);

        // 字符串连接是不需要使用concat的，用+号
        var result5 = str1 + str2 + str3 + num;
        console.log(result5);

        // concat不管什么类型统，都会把所有参数都转成字符串
