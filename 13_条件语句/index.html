<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var flag = true;
        var food = "红烧肉";
        // if..else的匹配规则：if总是找离他最近的一个else
        if(flag){
            if(food === "红烧肉"){
                console.log("吃红烧肉");
            }else{
                console.log("黄瓜");
            }
        }else{
            console.log("不吃饭");
        }
    </script>
</body>
</html>
