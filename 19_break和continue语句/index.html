<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 需求：如果i=5,则不再继续执行下去
        for(var i=0; i<=100; i++){
            if(i == 5){
                break;
            }
            console.log(i);
        }
        
        // 需求：如果i=5，则跳过本次循环，继续下一次循环
        for(var i=0; i<=100; i++){
            if(i == 5){
                continue;
            }
            console.log(i);
        }
    </script>
</body>
</html>
