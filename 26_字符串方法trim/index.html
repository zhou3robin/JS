<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // trim方法用于去除字符串两端的空格，返回一个新的字符串，不改变原字符串
        // 不仅是空格，还包括制表符（\t,\v)、换行符（\n）、回车符（\r）
    
         var name = "  itbai zhan   ";
         console.log(name.trim());
         
         var name2 = "\r\n itbaizhan\t";
         console.log(name2.trim());

         var name3 = "  itbaizhan   ";
         console.log(name3.trimStart());
         console.log(name3.trimEnd());
    </script>
</body>
</html>
